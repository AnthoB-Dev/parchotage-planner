<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Parchotage Planner (maquette UI v1)</title>
<style>
  :root {
    --bg0:#14101f;
    --bg1:#241b38;
    --gold:#e8c76a;
    --gold-dim:#a98f4f;
    --ink:#2c2114;
    --muted:#8a7550;
    --card:#f8f0da;
    --card-line:#e0cfa2;
    --card-strong:#cbb27e;
    --good:#2e7d32;
    --bad:#b33939;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg0); }
  body {
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color:#ece3cd;
    background:
      radial-gradient(1200px 620px at 50% -12%, #352764 0%, rgba(53,39,100,0) 60%),
      radial-gradient(900px 520px at 100% 112%, #4a2458 0%, rgba(74,36,88,0) 58%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    min-height:100vh;
    background-attachment: fixed;
    padding-bottom:80px;
  }
  .serif { font-family: Georgia, "Palatino Linotype", "Times New Roman", serif; }
  .num { font-variant-numeric: tabular-nums; }

  .proto-note { background:#241d12; color:#e0c36a; border-bottom:1px solid #4a3d1d; padding:6px 16px; font-size:.78rem; }
  .proto-note b { letter-spacing:.02em; }

  header.site {
    padding:24px 20px 20px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-bottom:1px solid rgba(232,199,106,.22);
  }
  header.site .eyebrow { text-transform:uppercase; letter-spacing:.22em; font-size:.68rem; color:var(--gold-dim); margin:0 0 6px; }
  header.site h1 { font-size:1.75rem; margin:0; font-weight:700; letter-spacing:.01em; color:var(--gold); text-shadow:0 1px 0 rgba(0,0,0,.4); }
  header.site .sub { font-size:.84rem; color:#c9bd9c; margin:4px 0 0; }
  .total-badge {
    text-align:right;
    background:linear-gradient(180deg, rgba(232,199,106,.10), rgba(232,199,106,.03));
    border:1px solid rgba(232,199,106,.4);
    border-radius:10px;
    padding:10px 18px;
    box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.35);
  }
  .total-badge .lbl { display:block; font-size:.66rem; text-transform:uppercase; letter-spacing:.16em; color:var(--gold-dim); }
  .total-badge .amt { font-size:1.4rem; font-weight:700; color:var(--gold); }
  .total-badge .amt small { font-size:.75rem; font-weight:400; color:#c9bd9c; }

  main { padding:22px; max-width:1080px; margin:0 auto; }

  fieldset { border:1px solid var(--card-line); background:var(--card); border-radius:10px; padding:12px 16px; margin:0 0 20px; color:var(--ink); }
  legend { font-size:.78rem; color:var(--muted); padding:0 8px; text-transform:uppercase; letter-spacing:.1em; }

  table { border-collapse:collapse; width:100%; }
  th, td { border:1px solid var(--card-line); padding:6px 8px; font-size:.85rem; text-align:left; vertical-align:middle; }
  th { background:#efe3c0; color:var(--ink); font-weight:600; }
  th .lim { display:block; font-size:.66rem; font-weight:400; color:var(--muted); }
  .num { text-align:right; }

  input[type=number] {
    width:68px; padding:6px 7px;
    border:1px solid var(--card-strong); border-radius:7px;
    background:#fffdf4; color:var(--ink); font-size:.88rem;
    font-variant-numeric: tabular-nums;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
  }
  input[type=number]:focus { outline:2px solid var(--gold); outline-offset:1px; border-color:transparent; }
  label.field { display:flex; flex-direction:column; gap:3px; font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; }

  .warn { color:var(--bad); font-size:.8rem; }
  .good { color:var(--good); }

  /* ---- Variante B : cartes ---- */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card {
    background:linear-gradient(180deg, #fdf6e4, var(--card));
    border:1px solid var(--card-strong);
    border-top:5px solid var(--c);
    border-radius:10px;
    padding:14px 16px 16px;
    position:relative;
    color:var(--ink);
    box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .card h3 {
    margin:0 0 12px; font-size:1.05rem; font-weight:700; letter-spacing:.02em; color:var(--ink);
    display:flex; align-items:center; gap:9px;
  }
  .seal {
    width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.85) 0 12%, rgba(255,255,255,0) 13%),
      linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 52%, #000));
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.32), inset 0 2px 2px rgba(255,255,255,.3), 0 2px 3px rgba(0,0,0,.4);
    display:inline-block;
  }
  .card .inputs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .recipe { font-size:.8rem; color:var(--muted); margin:0 0 6px; }
  .recipe .pill {
    display:inline-block; margin:0 6px 4px 0;
    background:#fffdf4; border:1px solid var(--card-line); border-radius:999px;
    padding:1px 9px; font-size:.78rem; color:var(--ink);
  }
  .card .cost { font-size:1.05rem; color:#7a5c16; font-weight:700; }
  .card .cost .k { font-weight:400; font-size:.8rem; color:var(--muted); }
  .card .warn { display:block; margin-top:6px; }

  details.prices {
    background:var(--card); border:1px solid var(--card-strong); border-radius:10px; padding:0; margin-bottom:20px;
    color:var(--ink); box-shadow:0 8px 22px rgba(0,0,0,.3);
  }
  details.prices summary {
    cursor:pointer; padding:13px 16px; font-weight:600; font-size:.9rem; color:var(--ink);
    list-style:none; user-select:none;
  }
  details.prices summary::-webkit-details-marker { display:none; }
  details.prices summary::before { content:"▸ "; color:#7a5c16; }
  details.prices[open] summary::before { content:"▾ "; }
  details.prices .inner { padding:0 16px 14px; }

  .switcher {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:12px;
    background:#2b2135; color:#ece3cd; padding:8px 14px; border-radius:999px;
    border:1px solid rgba(232,199,106,.35);
    box-shadow:0 6px 20px rgba(0,0,0,.5); font-size:.85rem; z-index:99;
  }
  .switcher button { background:#3d3050; color:#ece3cd; border:0; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:.95rem; }
  .switcher button:hover { background:#54406b; }
  .switcher .key { font-weight:700; color:var(--gold); }
</style>
</head>
<body>
<div class="proto-note">⚠ <b>PROTOTYPE jetable</b> — maquette pour valider forme &amp; comportement. Bascule de variante : barre flottante en bas ou touches ← / →.</div>

<div id="app"></div>

<div class="switcher" id="switcher">
  <button id="prev" title="Variante précédente">←</button>
  <span id="label"></span>
  <button id="next" title="Variante suivante">→</button>
</div>

<script>
"use strict";

const STATS = [
  { key:"FORCE",  name:"Force",        color:"#ff7a3c" },
  { key:"VITA",   name:"Vitalité",     color:"#ff5a5a" },
  { key:"SAGE",   name:"Sagesse",      color:"#4da6e0" },
  { key:"CHANCE", name:"Chance",       color:"#ffd23e" },
  { key:"AGI",    name:"Agilité",      color:"#4cd97b" },
  { key:"INTE",   name:"Intelligence", color:"#b06be0" },
];

const PALIERS = [
  { key:"petit",    name:"Petit Parchemin",   threshold:25,  gain:1, def:1000 },
  { key:"parchemin",name:"Parchemin",         threshold:50,  gain:1, def:2500 },
  { key:"grand",    name:"Grand Parchemin",   threshold:80,  gain:1, def:5000 },
  { key:"puissant", name:"Puissant Parchemin",threshold:100, gain:2, def:8000 },
];

const VARIANTS = {
  A: { name:"Formulaire linéaire" },
  B: { name:"Cartes par stat" },
  C: { name:"Matrice dense" },
};

const state = {
  stats: {},
  prices: {},
};
STATS.forEach(s => { state.stats[s.key] = { cur:0, obj:100 }; state.prices[s.key] = {}; });
STATS.forEach(s => PALIERS.forEach(p => { state.prices[s.key][p.key] = p.def; }));

const fmt = n => n.toLocaleString("fr-FR");

function compute(statKey) {
  const cur = state.stats[statKey].cur;
  const obj = state.stats[statKey].obj;
  const pr = state.prices[statKey];
  const q = { petit:0, parchemin:0, grand:0, puissant:0 };
  const out = { cost:0, reachable:true, warnings:[], quantities:q };

  if (cur >= obj) {
    out.warnings.push("Déjà-parchoté ≥ objectif → 0 parchemin nécessaire.");
    return out;
  }
  if (cur >= 80 && cur % 2 === 1) {
    out.reachable = false;
    out.warnings.push("Déjà-parchoté impair ≥ 80 : état inatteignable en jeu.");
    return out;
  }
  if (obj > 80 && obj % 2 === 1) {
    out.reachable = false;
    out.warnings.push("Objectif impair > 80 : inatteignable (seul le Puissant +2 couvre 80→100).");
    return out;
  }
  const INF = Infinity;
  const dp = new Array(101).fill(INF);
  const parent = new Array(101).fill(null);
  dp[cur] = 0;
  for (let n = cur; n <= 100; n++) {
    if (dp[n] === INF) continue;
    const steps = [];
    if (n < 25)  steps.push({ gain:1, key:"petit",    cost:pr.petit });
    if (n < 50)  steps.push({ gain:1, key:"parchemin",cost:pr.parchemin });
    if (n < 80)  steps.push({ gain:1, key:"grand",    cost:pr.grand });
    if (n < 100) steps.push({ gain:2, key:"puissant", cost:pr.puissant });
    for (const s of steps) {
      const next = n + s.gain;
      if (next > obj) continue;
      if (dp[n] + s.cost < dp[next]) { dp[next] = dp[n] + s.cost; parent[next] = { from:n, key:s.key }; }
    }
  }
  if (dp[obj] === INF) {
    out.reachable = false;
    out.warnings.push("Objectif inatteignable avec les paliers disponibles.");
    return out;
  }
  out.cost = dp[obj];
  let t = obj;
  while (parent[t]) { out.quantities[parent[t].key]++; t = parent[t].from; }
  return out;
}

function priceInputsTable(includeStatHeader) {
  let h = "<table><thead><tr>";
  if (includeStatHeader) h += "<th>Statistique</th>";
  PALIERS.forEach(p => h += `<th>${p.name}<span class="lim">&lt; ${p.threshold}</span></th>`);
  h += "</tr></thead><tbody>";
  STATS.forEach(s => {
    h += `<tr>${includeStatHeader ? `<td>${s.name}</td>` : ""}`;
    PALIERS.forEach(p => {
      h += `<td class="num"><input type="number" min="0" id="in-price-${s.key}-${p.key}" data-kind="price" data-stat="${s.key}" data-palier="${p.key}" value="${state.prices[s.key][p.key]}"></td>`;
    });
    h += "</tr>";
  });
  h += "</tbody></table>";
  return h;
}

function resultTable() {
  let h = `<table><thead><tr><th>Statistique</th>`;
  PALIERS.forEach(p => h += `<th>${p.name}</th>`);
  h += `<th>Coût (kamas)</th><th></th></tr></thead><tbody>`;
  STATS.forEach(st => {
    h += `<tr><td>${st.name}</td>`;
    PALIERS.forEach(p => h += `<td class="num" id="res-qty-${st.key}-${p.key}">—</td>`);
    h += `<td class="num" id="res-cost-${st.key}">—</td><td id="res-warn-${st.key}"></td></tr>`;
  });
  h += `</tbody></table>`;
  return h;
}

/* ---------- Variant A : formulaire linéaire ---------- */
function renderA() {
  return `
    ${siteHeader()}
    <section>
      <fieldset><legend>1 · Prix des parchemins (kamas)</legend>${priceInputsTable(true)}</fieldset>
      <fieldset><legend>2 · Objectifs par statistique</legend>
        <table><thead><tr><th>Statistique</th><th>Déjà-parchoté</th><th>Objectif</th></tr></thead><tbody>
        ${STATS.map(s => `<tr><td>${s.name}</td><td><input type="number" min="0" max="100" id="in-cur-${s.key}" data-kind="cur" data-stat="${s.key}" value="${state.stats[s.key].cur}"></td><td><input type="number" min="0" max="100" id="in-obj-${s.key}" data-kind="obj" data-stat="${s.key}" value="${state.stats[s.key].obj}"></td></tr>`).join("")}
        </tbody></table>
      </fieldset>
      <fieldset><legend>3 · Recette recommandée</legend>
        ${resultTable()}
        <div id="res-global-warn"></div>
      </fieldset>
    </section>`;
}

/* ---------- Variant B : cartes par stat ---------- */
function renderB() {
  return `
    ${siteHeader()}
    <details class="prices">
      <summary>Prix des parchemins (kamas)</summary>
      <div class="inner">${priceInputsTable(true)}</div>
    </details>
    <div class="cards">
      ${STATS.map(s => `
        <div class="card" style="--c:${s.color}">
          <h3><span class="seal"></span>${s.name}</h3>
          <div class="inputs">
            <label class="field">Déjà-parchoté
              <input type="number" min="0" max="100" id="in-cur-${s.key}" data-kind="cur" data-stat="${s.key}" value="${state.stats[s.key].cur}">
            </label>
            <label class="field">Objectif
              <input type="number" min="0" max="100" id="in-obj-${s.key}" data-kind="obj" data-stat="${s.key}" value="${state.stats[s.key].obj}">
            </label>
          </div>
          <div id="res-${s.key}"></div>
        </div>`).join("")}
    </div>
    <div id="res-global-warn"></div>`;
}

/* ---------- Variant C : matrice dense ---------- */
function renderC() {
  let h = `${siteHeader()}
    <table>
      <thead><tr>
        <th>Statistique</th>
        <th>Déjà-parchoté</th><th>Objectif</th>`;
  PALIERS.forEach(p => h += `<th>${p.name}<span class="lim">&lt; ${p.threshold}</span></th>`);
  h += `<th>Petit</th><th>Parchemin</th><th>Grand</th><th>Puissant</th><th>Coût (kamas)</th></tr></thead><tbody>`;
  STATS.forEach(s => {
    h += `<tr><td>${s.name}</td>`;
    h += `<td><input type="number" min="0" max="100" id="in-cur-${s.key}" data-kind="cur" data-stat="${s.key}" value="${state.stats[s.key].cur}"></td>`;
    h += `<td><input type="number" min="0" max="100" id="in-obj-${s.key}" data-kind="obj" data-stat="${s.key}" value="${state.stats[s.key].obj}"></td>`;
    PALIERS.forEach(p => {
      h += `<td><input type="number" min="0" id="in-price-${s.key}-${p.key}" data-kind="price" data-stat="${s.key}" data-palier="${p.key}" value="${state.prices[s.key][p.key]}"></td>`;
    });
    PALIERS.forEach(p => h += `<td class="num" id="res-qty-${s.key}-${p.key}">—</td>`);
    h += `<td class="num" id="res-cost-${s.key}">—</td>`;
    h += `<td id="res-warn-${s.key}"></td></tr>`;
  });
  h += `</tbody></table>`;
  h += `<div id="res-global-warn"></div>`;
  return h;
}

function siteHeader() {
  return `
    <header class="site">
      <div>
        <p class="eyebrow">Dofus 3 · calcul du parchotage</p>
        <h1 class="serif">Parchotage Planner</h1>
        <p class="sub">La combinaison de parchemins la moins chère pour atteindre vos objectifs.</p>
      </div>
      <div class="total-badge">
        <span class="lbl">Coût total estimé</span>
        <span class="amt num"><span id="res-total">—</span> <small>kamas</small></span>
      </div>
    </header>`;
}

function render(variant) {
  const app = document.getElementById("app");
  if (variant === "A") app.innerHTML = renderA();
  else if (variant === "B") app.innerHTML = renderB();
  else app.innerHTML = renderC();
  document.getElementById("label").innerHTML = `<span class="key">${variant}</span> — ${VARIANTS[variant].name}`;
  refreshResults();
}

function refreshResults() {
  let total = 0;
  const globalWarns = [];
  STATS.forEach(s => {
    const r = compute(s.key);
    total += r.cost;
    const warnEl = document.getElementById(`res-warn-${s.key}`);
    if (warnEl) {
      warnEl.className = r.warnings.length ? "warn" : "good";
      warnEl.textContent = r.warnings.length ? r.warnings.join(" ") : (r.cost === 0 ? "—" : "✓");
    }
    PALIERS.forEach(p => {
      const el = document.getElementById(`res-qty-${s.key}-${p.key}`);
      if (el) el.textContent = r.quantities[p.key];
    });
    const costEl = document.getElementById(`res-cost-${s.key}`);
    if (costEl) costEl.textContent = r.reachable ? fmt(r.cost) : "—";
    const inline = document.getElementById(`res-${s.key}`);
    if (inline) {
      const pills = PALIERS.filter(p => r.quantities[p.key] > 0)
        .map(p => `<span class="pill">${r.quantities[p.key]}× ${p.name}</span>`).join("");
      inline.innerHTML = `
        <p class="recipe">${pills || `<span class="good">Aucun parchemin nécessaire</span>`}</p>
        <div class="cost num">${r.reachable ? fmt(r.cost) : "—"} <span class="k">kamas</span></div>
        ${r.warnings.length ? `<span class="warn">${r.warnings.join(" ")}</span>` : ""}`;
    }
    if (r.warnings.length) globalWarns.push(`${s.name} : ${r.warnings.join(" ")}`);
  });
  const totalEl = document.getElementById("res-total");
  if (totalEl) totalEl.textContent = fmt(total);
  const g = document.getElementById("res-global-warn");
  if (g) g.innerHTML = globalWarns.length ? `<p class="warn">⚠ ${globalWarns.join("<br>")}</p>` : "";
}

function updateFromInput(el) {
  const kind = el.dataset.kind, stat = el.dataset.stat;
  if (kind === "cur") state.stats[stat].cur = Number(el.value) || 0;
  else if (kind === "obj") state.stats[stat].obj = Number(el.value) || 0;
  else if (kind === "price") state.prices[stat][el.dataset.palier] = Number(el.value) || 0;
  refreshResults();
}

document.getElementById("app").addEventListener("input", e => { if (e.target.dataset && e.target.dataset.kind) updateFromInput(e.target); });

let current = new URLSearchParams(location.search).get("variant") || "B";
if (!VARIANTS[current]) current = "B";

function go(v) {
  current = v;
  const url = new URL(location.href);
  url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
  render(v);
}
document.getElementById("prev").addEventListener("click", () => {
  const keys = Object.keys(VARIANTS);
  go(keys[(keys.indexOf(current) + keys.length - 1) % keys.length]);
});
document.getElementById("next").addEventListener("click", () => {
  const keys = Object.keys(VARIANTS);
  go(keys[(keys.indexOf(current) + 1) % keys.length]);
});
document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable)) return;
  const keys = Object.keys(VARIANTS);
  if (e.key === "ArrowLeft") go(keys[(keys.indexOf(current) + keys.length - 1) % keys.length]);
  if (e.key === "ArrowRight") go(keys[(keys.indexOf(current) + 1) % keys.length]);
});

render(current);
</script>
</body>
</html>
